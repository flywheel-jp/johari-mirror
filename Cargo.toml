[package]
name = "johari-mirror"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
futures = "0.3.34"
k8s-openapi = { version = "0.29.0", features = ["v1_34"] }
kube = { version = "5.0.0", default-features = false, features = [
    "runtime",
    "client",
    "rustls-tls",
    "aws-lc-rs",
] }
log = "0.4.35"
reqwest = { version = "0.13.5", features = [
    "form",
    "json",
] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wildmatch = "2.7.0"
